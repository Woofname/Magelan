<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG 跑團工具入口網</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 暗黑奇幻風格客製化色彩與細節 */
    :root {
      --bg-main: #121214;
      --bg-card: #1e1e24;
      --gold-main: #d4af37;
      --gold-hover: #f3e5ab;
    }
    body {
      background-color: var(--bg-main);
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    /* iOS Iframe 捲動最佳化 */
    .iframe-container {
      -webkit-overflow-scrolling: touch;
      overflow-y: auto;
    }
    /* 金屬金邊框與文字亮光效果 */
    .border-gold {
      border-color: rgba(212, 175, 55, 0.4);
    }
    .text-gold {
      color: var(--gold-main);
    }
    .bg-gold {
      background-color: var(--gold-main);
    }
    .hover-gold:hover {
      color: var(--gold-hover);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden">

  <!-- 1. 驗證閘道（未登入 / 驗證中狀態） -->
  <div id="login-gateway" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
    <div class="max-w-md w-full bg-[#1e1e24] border border-gold/40 rounded-xl p-8 shadow-2xl text-center relative overflow-hidden">
      <!-- 奇幻裝飾圖騰風格頂條 -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-[#d4af37] to-transparent"></div>
      
      <div class="mb-6 inline-flex items-center justify-center w-20 h-20 rounded-full bg-[#121214] border border-gold text-[#d4af37] text-3xl shadow-lg">
        <i class="fa-solid font-sharp fa-dice-d20"></i>
      </div>
      
      <h1 class="text-2xl font-bold text-gold tracking-wide mb-2">TRPG 跑團大廳</h1>
      <p class="text-gray-400 text-sm mb-6">歡迎冒險者。本站為私密團友入口，需登入獲授權之 Google 帳號後存取。</p>

      <button id="btn-login" onclick="handleGoogleLogin()" class="w-full py-3.5 px-4 bg-gradient-to-r from-[#d4af37] to-[#b8860b] hover:from-[#f3e5ab] hover:to-[#d4af37] text-gray-950 font-bold rounded-lg shadow-lg flex items-center justify-center gap-3 transition-all duration-200 active:scale-95 min-h-[44px]">
        <i class="fa-brands fa-google text-lg"></i>
        <span>使用 Google 帳號登入</span>
      </button>

      <!-- 讀取指示器 -->
      <div id="auth-spinner" class="hidden mt-4 text-gold text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-spinner fa-spin"></i> 正在驗證冒險者身分與白名單...
      </div>
    </div>
  </div>

  <!-- 2. 工作區主介面（驗證成功後顯示） -->
  <div id="app-workspace" class="hidden h-full w-full flex flex-col md:flex-row overflow-hidden">
    
    <!-- 手機 / 平板端 頂部 Header -->
    <header class="md:hidden flex items-center justify-between px-4 py-3 bg-[#1e1e24] border-b border-gold/30 shrink-0">
      <div class="flex items-center gap-3">
        <button id="btn-hamburger" onclick="toggleMobileSidebar(true)" class="p-2 text-gold hover:text-white rounded-lg focus:outline-none min-w-[44px] min-h-[44px] flex items-center justify-center">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
        <span class="font-bold text-gold tracking-wide">TRPG 工具庫</span>
      </div>
      
      <!-- 使用者頭像/身分區 (Mobile) -->
      <div class="flex items-center gap-2">
        <img id="user-avatar-mobile" class="w-8 h-8 rounded-full border border-gold" src="" alt="Avatar" />
        <button onclick="handleLogout()" class="text-xs text-red-400 hover:text-red-300 p-2 min-h-[44px]">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <!-- 手機端 抽屜式選單遮罩 (Overlay) -->
    <div id="sidebar-overlay" onclick="toggleMobileSidebar(false)" class="fixed inset-0 bg-black/70 z-40 hidden md:hidden transition-opacity"></div>

    <!-- 側邊欄 Sidebar (桌面端固定，手機端 Off-canvas Drawer) -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-50 w-64 bg-[#18181c] border-r border-gold/30 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shrink-0">
      
      <!-- 側邊欄頂部 Logo -->
      <div class="p-5 border-b border-gold/20 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-dice-d20 text-gold text-2xl"></i>
          <span class="font-bold text-lg text-gold tracking-wider">跑團工作區</span>
        </div>
        <button onclick="toggleMobileSidebar(false)" class="md:hidden text-gray-400 hover:text-white p-2 min-w-[44px] min-h-[44px]">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- 選單清單 -->
      <nav class="flex-1 overflow-y-auto p-4 space-y-1.5" id="tools-menu">
        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider px-3 mb-2">MH5e 規則與資料庫</div>
        
        <button onclick="loadTool('./tools/mh5e-weapons.html', this)" class="menu-item w-full flex items-center gap-3 px-3.5 py-3 rounded-lg bg-[#25252d] text-gold hover:bg-[#25252d] hover:text-gold transition-colors active:bg-[#2a2a35] text-left min-h-[44px] active">
          <i class="fa-solid fa-shield-halved w-5 text-center text-amber-400"></i>
          <span class="text-sm font-medium">武器裝備與音符規則</span>
        </button>

        <button onclick="loadTool('./tools/resource-gatherer.html', this)" class="menu-item w-full flex items-center gap-3 px-3.5 py-3 rounded-lg text-gray-300 hover:bg-[#25252d] hover:text-gold transition-colors active:bg-[#2a2a35] text-left min-h-[44px]">
          <i class="fa-solid fa-compass w-5 text-center text-emerald-400"></i>
          <span class="text-sm font-medium">地區資源採集助手</span>
        </button>

        <button onclick="loadTool('./tools/mh5e-compendium.html', this)" class="menu-item w-full flex items-center gap-3 px-3.5 py-3 rounded-lg text-gray-300 hover:bg-[#25252d] hover:text-gold transition-colors active:bg-[#2a2a35] text-left min-h-[44px]">
          <i class="fa-solid fa-book-bookmark w-5 text-center text-sky-400"></i>
          <span class="text-sm font-medium">魔物獵人 D&D 資料百科</span>
        </button>

        <button onclick="loadTool('./tools/status-conditions.html', this)" class="menu-item w-full flex items-center gap-3 px-3.5 py-3 rounded-lg text-gray-300 hover:bg-[#25252d] hover:text-gold transition-colors active:bg-[#2a2a35] text-left min-h-[44px]">
          <i class="fa-solid fa-skull-crossbones w-5 text-center text-rose-400"></i>
          <span class="text-sm font-medium">異常狀態速查手冊</span>
        </button>

        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider px-3 mt-4 mb-2">跑團輔助工具</div>

        <button onclick="loadTool('./tools/hp-tracker.html', this)" class="menu-item w-full flex items-center gap-3 px-3.5 py-3 rounded-lg text-gray-300 hover:bg-[#25252d] hover:text-gold transition-colors active:bg-[#2a2a35] text-left min-h-[44px]">
          <i class="fa-solid fa-heart-pulse w-5 text-center text-red-400"></i>
          <span class="text-sm font-medium">血量與狀態追蹤器</span>
        </button>
      </nav>

      <!-- 側邊欄底部：使用者資訊與登出 (Desktop) -->
      <div class="p-4 border-t border-gold/20 bg-[#121214] flex items-center justify-between">
        <div class="flex items-center gap-3 overflow-hidden">
          <img id="user-avatar-desktop" class="w-9 h-9 rounded-full border border-gold shrink-0" src="" alt="Avatar" />
          <div class="truncate">
            <div id="user-name" class="text-sm font-medium text-gray-200 truncate">冒險者</div>
            <div id="user-email" class="text-xs text-gray-500 truncate">email@example.com</div>
          </div>
        </div>
        <button onclick="handleLogout()" title="登出" class="text-gray-400 hover:text-red-400 p-2 rounded-lg transition-colors shrink-0 min-w-[44px] min-h-[44px] flex items-center justify-center">
          <i class="fa-solid fa-right-from-bracket text-lg"></i>
        </button>
      </div>
    </aside>

    <!-- 右側/下方的 Iframe 工具載入區域 -->
    <main class="flex-1 h-full w-full bg-[#121214] relative iframe-container">
      <iframe id="tool-viewport" class="w-full h-full border-none block" src="./tools/mh5e-weapons.html" title="Tool Workspace"></iframe>
    </main>
  </div>

  <!-- Firebase Auth SDK (v10 Modular via CDN Script) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // FIXME: 請替換為您的 Firebase 專案設定
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // 將 Auth 方法掛載至 window 供 HTML 按鈕呼叫
    window.handleGoogleLogin = async () => {
      const spinner = document.getElementById('auth-spinner');
      try {
        spinner.classList.remove('hidden');
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Login Error:", error);
        alert("Google 登入失敗：" + error.message);
        spinner.classList.add('hidden');
      }
    };

    window.handleLogout = () => {
      signOut(auth).then(() => {
        window.location.reload();
      });
    };

    // SHA-256 轉碼函式 (Web Crypto API)
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // 驗證 Email 是否在白名單內
    async function verifyWhitelist(email) {
      try {
        const cleanEmail = email.trim().toLowerCase();
        const emailHash = await sha256(cleanEmail);

        // 讀取 whitelist.json（帶時間戳避免快取）
        const response = await fetch('./whitelist.json?t=' + Date.now());
        if (!response.ok) {
          throw new Error('無法讀取白名單檔案');
        }
        const whitelist = await response.json();

        return whitelist.includes(emailHash);
      } catch (error) {
        console.error("Whitelist Verification Error:", error);
        return false;
      }
    }

    // 監聽 Firebase 登入狀態變更
    onAuthStateChanged(auth, async (user) => {
      const loginGateway = document.getElementById('login-gateway');
      const appWorkspace = document.getElementById('app-workspace');
      const spinner = document.getElementById('auth-spinner');

      if (user) {
        spinner.classList.remove('hidden');
        const isAuthorized = await verifyWhitelist(user.email);

        if (isAuthorized) {
          // 驗證成功：顯示工作區
          loginGateway.classList.add('hidden');
          appWorkspace.classList.remove('hidden');

          // 更新使用者 UI 資訊
          document.getElementById('user-name').textContent = user.displayName || '冒險者';
          document.getElementById('user-email').textContent = user.email;
          if (user.photoURL) {
            document.getElementById('user-avatar-desktop').src = user.photoURL;
            document.getElementById('user-avatar-mobile').src = user.photoURL;
          }
        } else {
          // 驗證失敗：跳出提示並強制登出
          alert(`存取被拒：帳號 (${user.email}) 未在團友白名單中。`);
          await signOut(auth);
          loginGateway.classList.remove('hidden');
          appWorkspace.classList.add('hidden');
        }
      } else {
        // 未登入狀態
        loginGateway.classList.remove('hidden');
        appWorkspace.classList.add('hidden');
      }
      spinner.classList.add('hidden');
    });
  </script>

  <!-- 全域 UI 操作邏輯 -->
  <script>
    // 切換小工具頁面
    function loadTool(url, buttonEl) {
      const iframe = document.getElementById('tool-viewport');
      iframe.src = url;

      // 切換按鈕 active 樣式
      document.querySelectorAll('.menu-item').forEach(el => {
        el.classList.remove('bg-[#25252d]', 'text-gold');
        el.classList.add('text-gray-300');
      });
      if (buttonEl) {
        buttonEl.classList.add('bg-[#25252d]', 'text-gold');
        buttonEl.classList.remove('text-gray-300');
      }

      // 若為行動端，點擊工具後自動收起側邊欄
      toggleMobileSidebar(false);
    }

    // 手機端側邊欄開關控制
    function toggleMobileSidebar(show) {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      
      if (show) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
