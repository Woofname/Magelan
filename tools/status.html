        :root {
            --parchment-bg: #FAF6ED;
            --parchment-card: #FFFFFF;
            --parchment-border: #D4C39D;
            --ink-primary: #1C1917;
            --ink-secondary: #44403C;
            --gold-accent: #B45309;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0F0D0B;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(180, 83, 9, 0.18), transparent 75%),
                radial-gradient(circle at 50% 100%, rgba(120, 53, 15, 0.15), transparent 80%),
                linear-gradient(to bottom, #17120E, #0A0806);
            color: var(--ink-primary);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .font-cinzel {
            font-family: 'Cinzel', 'Noto Sans TC', serif;
        }

        /* High contrast Parchment Card Box */
        .parchment-box {
            background-color: #FAF8F2;
            border: 1px solid var(--parchment-border);
            box-shadow: 0 4px 15px -2px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(212, 195, 157, 0.15);
            position: relative;
        }

        /* Decorative Corner Ornaments */
        .corner-ornament {
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: #B45309;
            pointer-events: none;
            opacity: 0.6;
        }
        .corner-tl { top: 4px; left: 4px; border-top: 2px solid; border-left: 2px solid; }
        .corner-tr { top: 4px; right: 4px; border-top: 2px solid; border-right: 2px solid; }
        .corner-bl { bottom: 4px; left: 4px; border-bottom: 2px solid; border-left: 2px solid; }
        .corner-br { bottom: 4px; right: 4px; border-bottom: 2px solid; border-right: 2px solid; }

        /* Hide scrollbars for mobile tab slider */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* High Legibility Keyword Badges */
        .kw-advantage {
            background-color: #DCFCE7;
            color: #14532D;
            border: 1px solid #86EFAC;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            display: inline-block;
            line-height: 1.2;
        }
        .kw-disadvantage {
            background-color: #FEE2E2;
            color: #7F1D1D;
            border: 1px solid #FCA5A5;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            display: inline-block;
            line-height: 1.2;
        }
        .kw-highlight {
            background-color: #FEF3C7;
            color: #78350F;
            border: 1px solid #FDE047;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            display: inline-block;
            line-height: 1.2;
        }

        .wax-tab {
            transition: all 0.2s ease;

            color: #FEF08A;
            border-color: #F59E0B;

                    '【社交優勢】魅惑源對你進行的任何 **社交屬性檢定均具有優勢**。'
                ]
            },
            {
                id: 'petrified-2024',
                name: '石化 (Petrified)',
                category: 'dnd2024',
                categoryLabel: 'D&D 2024 官方',
                type: '狀態',
                mechanics: [
                    '【化為石質】軀體與非魔法物品變為石質，重量變為 **10 倍**，停止老化。',
                    '【失能與速度 0】陷入 **失能**，速度變 0。**力量與敏捷豁免自動失敗**。',
                    '【攻擊與抗性】攻擊者具 **優勢**。獲得 **所有傷害抗性**，且 **免疫中毒** 狀態。'
                ]
            },
            {
                id: 'shapeshifting-2024',
                name: '變形 (Shape-shifting)',
                category: 'dnd2024',
                categoryLabel: 'D&D 2024 官方',
                type: '狀態 / 效應',
                mechanics: [
                    '【效果延續】身上發生的狀態、法術、詛咒會持續帶至新形態。若死亡則變回真實形態。',
                    '【能力與裝備】變形後職業與種族能力、專長等暫時消失（職業持續效果如天生術法立即結束）。不會自動變出裝備。'
                ]
            },
            {
                id: 'bloodied-2024',
                name: '血腥 / 浴血 (Bloodied)',
                category: 'dnd2024',
                categoryLabel: 'D&D 2024 官方',
                type: '狀態',
                mechanics: [
                    '【生命門檻】當生物當前生命值降至 **最大生命值的 50% 或更少** 時，自動陷入此狀態。',
                    '【能力連動】許多職業能力（如生命領域牧師引導神力）或怪物特質會在目標血腥時觸發額外效果。'
                ]
            },
            {
                id: 'dead-2024',
                name: '死亡 (Dead)',
                category: 'dnd2024',
                categoryLabel: 'D&D 2024 官方',
                type: '狀態',
                mechanics: [
                    '【無法自然恢復】沒有生命值，除非先獲得復活魔法，否則無法恢復生命值。',
                    '【靈魂自由】靈魂前往外層位面，知道施法者身份並可選擇拒絕復活。',
                    '【復活保留效應】帶著未過期狀態復活；力竭等級減少 1 級；自動解除所有魔法物品同調 (Attunement)。'
                ]
            },
            {
                id: 'hide-2024',
                name: '隱蔽 / 躲藏 (Hide)',
                category: 'dnd2024',
                categoryLabel: 'D&D 2024 官方',
                type: '狀態',
                mechanics: [
                    '【位置隱蔽】其他生物無法得知精確位置。你的 **攻擊與先攻檢定具有優勢**。',
                    '【解除條件】發起攻擊、發出超過耳語聲音（含具語音成分施法）、被敵方直視（掩體外）、被搜索/被動感知/盲視/震顫感知發現時解除。',
                    '【移動與戰鬥】可在掩體間移動，結束回合時若位於掩體外則自動失效。戰鬥中敵人知道你最後消失的位置。'
                ]
            }
        ];

        let currentCategory = 'all';
        let viewMode = 'cards';
        let pinnedIds = new Set();

        function setCategory(category) {
            currentCategory = category;
            
            ['all', 'dnd2024', 'mh'].forEach(cat => {
                const btn = document.getElementById(`tab-${cat}`);
                if (cat === category) {
                    btn.className = "wax-tab active px-3 py-2 rounded border border-transparent font-bold min-h-[38px] flex-1 text-center";
                } else {
                    btn.className = "wax-tab px-3 py-2 rounded border border-transparent text-amber-200/80 hover:text-amber-100 min-h-[38px] flex-1 text-center";
                }
            });

            renderView();
        }

        function setViewMode(mode) {
            viewMode = mode;
            const cardsBtn = document.getElementById('view-cards-btn');
            const tableBtn = document.getElementById('view-table-btn');

            if (mode === 'cards') {
                cardsBtn.className = "px-2.5 py-1.5 rounded bg-amber-700/90 text-amber-100 font-bold flex items-center gap-1 min-h-[36px]";
                tableBtn.className = "px-2.5 py-1.5 rounded text-amber-400/80 hover:text-amber-200 flex items-center gap-1 min-h-[36px]";
            } else {
                tableBtn.className = "px-2.5 py-1.5 rounded bg-amber-700/90 text-amber-100 font-bold flex items-center gap-1 min-h-[36px]";
                cardsBtn.className = "px-2.5 py-1.5 rounded text-amber-400/80 hover:text-amber-200 flex items-center gap-1 min-h-[36px]";
            }

            renderView();
        }

        function togglePin(id, event) {
            if (event) event.stopPropagation();
            if (pinnedIds.has(id)) {
                pinnedIds.delete(id);
            } else {
                pinnedIds.add(id);
            }
            renderView();
        }

        // High readability Keyword Formatter (Safe Regex Parsing)
        function formatRuleText(text) {
            if (!text) return '';
            return text.replace(/\*\*(.*?)\*\*/g, (match, p1) => {
                const trimmed = p1.trim();
                if (trimmed.includes('優勢')) {
                    return `<span class="kw-advantage">${p1}</span>`;
                }
                if (trimmed.includes('劣勢') || trimmed.includes('失敗')) {
                    return `<span class="kw-disadvantage">${p1}</span>`;
                }
                if (trimmed.includes('失能') || trimmed.includes('重擊')) {
                    return `<span class="kw-highlight">${p1}</span>`;
                }
                return `<strong class="text-stone-900 font-bold bg-amber-100/70 px-1 rounded">${p1}</strong>`;
            });
        }

        function renderView() {
            const container = document.getElementById('display-container');
            const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();

            // Filter items
            let filtered = conditions.filter(item => {
                const matchesCategory = (currentCategory === 'all') || (item.category === currentCategory);
                const matchesSearch = item.name.toLowerCase().includes(searchTerm) ||
                                      item.type.toLowerCase().includes(searchTerm) ||
                                      item.mechanics.some(m => m.toLowerCase().includes(searchTerm));
                return matchesCategory && matchesSearch;
            });

            // Sort pinned items to top
            filtered.sort((a, b) => {
                const aPinned = pinnedIds.has(a.id) ? 1 : 0;
                const bPinned = pinnedIds.has(b.id) ? 1 : 0;
                return bPinned - aPinned;
            });

            // Update Counters
            document.getElementById('match-count').innerText = filtered.length;
            const pinIndicator = document.getElementById('bookmarked-indicator');
            if (pinnedIds.size > 0) {
                pinIndicator.classList.remove('hidden');
                document.getElementById('pin-count').innerText = pinnedIds.size;
            } else {
                pinIndicator.classList.add('hidden');
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="parchment-box rounded-xl p-8 text-center text-amber-900 border border-amber-800/40">
                        <div class="text-4xl mb-2">📜</div>
                        <h3 class="text-lg font-bold font-cinzel">未找到符合的狀態典籍</h3>
                        <p class="text-sm text-stone-700 mt-1 font-sans">請嘗試修改關鍵字或搜尋其他名稱。</p>
                    </div>
                `;
                return;
            }

            if (viewMode === 'cards') {
                renderCards(container, filtered);
            } else {
                renderTable(container, filtered);
            }
        }

        // Render Cards Mode (Mobile 1 col, Tablet 2 cols, Desktop 3 cols)
        function renderCards(container, items) {
            const cardsHtml = items.map(item => {
                const isDnd = item.category === 'dnd2024';
                const isPinned = pinnedIds.has(item.id);

                const badgeBg = isDnd 
                    ? 'bg-stone-900 text-amber-200 border-amber-700/60' 
                    : 'bg-emerald-950 text-emerald-200 border-emerald-600/60';

                const pinClass = isPinned 
                    ? 'text-amber-500 font-bold scale-110' 
                    : 'text-stone-400 hover:text-amber-700';

                const formattedMechanics = item.mechanics.map(m => `
                    <li class="flex items-start gap-2">
                        <span class="text-amber-700 font-bold text-sm mt-0.5 shrink-0">✦</span>
                        <span class="leading-normal text-stone-900 text-sm font-normal">${formatRuleText(m)}</span>
                    </li>
                `).join('');

                return `
                    <div class="parchment-box rounded-xl p-4 sm:p-5 flex flex-col justify-between transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl ${isPinned ? 'ring-2 ring-amber-500' : ''}">
                        <div class="corner-ornament corner-tl"></div>
                        <div class="corner-ornament corner-tr"></div>
                        <div class="corner-ornament corner-bl"></div>
                        <div class="corner-ornament corner-br"></div>

                        <div>
                            <!-- Card Title Header -->
                            <div class="flex items-start justify-between gap-2 border-b border-amber-900/20 pb-2.5 mb-3">
                                <div>
                                    <h3 class="text-base sm:text-lg font-bold font-cinzel text-stone-950 tracking-wide">
                                        ${item.name}
                                    </h3>
                                    <div class="flex flex-wrap items-center gap-1.5 mt-1">
                                        <span class="px-2 py-0.5 rounded text-[11px] font-sans font-medium border ${badgeBg}">
                                            ${item.categoryLabel}
                                        </span>
                                        <span class="px-2 py-0.5 rounded text-[11px] font-sans font-medium bg-amber-200/70 text-amber-950 border border-amber-400/60">
                                            ${item.type}
                                        </span>
                                    </div>
                                </div>
                                <button onclick="togglePin('${item.id}', event)" class="${pinClass} text-2xl p-1 transition min-w-[36px] min-h-[36px] flex items-center justify-center" title="${isPinned ? '取消釘選' : '釘選至頂'}">
                                    ${isPinned ? '★' : '☆'}
                                </button>
                            </div>

                            <!-- Card Rules List -->
                            <ul class="space-y-2.5">
                                ${formattedMechanics}
                            </ul>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 sm:gap-5">${cardsHtml}</div>`;
        }

        // Render Mobile-Responsive Scrollable List/Table View
        function renderTable(container, items) {
            const rowsHtml = items.map((item, idx) => {
                const isDnd = item.category === 'dnd2024';
                const isPinned = pinnedIds.has(item.id);

                const badgeBg = isDnd 
                    ? 'bg-stone-900 text-amber-200 border-amber-600/60' 
                    : 'bg-emerald-950 text-emerald-200 border-emerald-600/60';

                const rowBg = idx % 2 === 0 ? 'bg-[#FAF8F2]' : 'bg-[#F3EDDF]';

                const formattedMechanics = item.mechanics.map(m => `
                    <li class="flex items-start gap-2">
                        <span class="text-amber-700 font-bold text-xs mt-1 shrink-0">✦</span>
                        <span class="leading-relaxed text-stone-900 text-sm font-normal">${formatRuleText(m)}</span>
                    </li>
                `).join('');

                return `
                    <tr class="${rowBg} hover:bg-amber-100/60 transition border-b border-amber-900/15">
                        <td class="px-2.5 py-3.5 text-center align-top w-10">
                            <button onclick="togglePin('${item.id}', event)" class="${isPinned ? 'text-amber-600' : 'text-stone-400'} text-xl hover:scale-110 transition">
                                ${isPinned ? '★' : '☆'}
                            </button>
                        </td>

                        <td class="px-3 py-3.5 align-top w-1/3 min-w-[150px]">
                            <div class="font-bold text-stone-950 font-cinzel text-sm sm:text-base mb-1">${item.name}</div>
                            <div class="flex flex-wrap gap-1">
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-sans border ${badgeBg}">${item.categoryLabel}</span>
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-sans bg-amber-200/60 text-amber-900 border border-amber-400/50">${item.type}</span>
                            </div>
                        </td>

                        <td class="px-3 py-3.5 align-top">
                            <ul class="space-y-1.5">
                                ${formattedMechanics}
                            </ul>
                        </td>
                    </tr>
                `;
            }).join('');

            container.innerHTML = `
                <div class="parchment-box rounded-xl overflow-hidden border border-amber-800/50 shadow-xl">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-stone-950 text-amber-200 font-cinzel text-xs sm:text-sm border-b border-amber-600/80">
                                <tr>
                                    <th class="px-2.5 py-3 text-center w-10">★</th>
                                    <th class="px-3 py-3 min-w-[150px] w-1/3 font-semibold">狀態名稱 / 類型</th>
                                    <th class="px-3 py-3 min-w-[280px] font-semibold">核心機制與規則效應</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-amber-900/10">
                                ${rowsHtml}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // Initialize view on page load
        window.onload = function() {
            renderView();
        };
    </script>
</body>
</html>
