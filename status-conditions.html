            </div>

                <!-- Search Input -->

                    <input type="text" id="search-input" placeholder="搜尋狀態、機制關鍵字..." 
                           class="w-full px-3 py-1.5 text-sm rounded-lg bg-stone-800 text-white border border-stone-700 focus:outline-none focus:ring-2 focus:ring-amber-500 placeholder-stone-400"
                           oninput="renderTable()">

                    <button onclick="setCategory('dnd2024')" id="tab-dnd2024" class="px-2.5 py-1 rounded transition text-stone-300 hover:text-white">D&D 2024 (19)</button>

    </header>

            </div>
        </div>

        <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-stone-200 custom-scrollbar">

                    '【復活保留效應】帶著未過期狀態復活；力竭等級減少 1 級；自動解除所有魔法物品同調 (Attunement)。'
                ],
                cure: '「回生術 (Revivify)」、「喚醒死者 (Raise Dead)」、「復活術 (Resurrection)」等復活魔法。'
            },
            {
                id: 'hide-2024',
                name: '躲藏 (Hide)',
                category: 'dnd2024',
                categoryLabel: 'D&D 2024 官方',
                type: '狀態',
                mechanics: [
                    '【位置隱蔽】其他生物無法得知精確位置。你的 **攻擊與先攻檢定具有優勢**。',
                    '【解除條件】發起攻擊、發出超過耳語聲音（含具語音成分施法）、被敵方直視（掩體外）、被搜索/被動感知/盲視/震顫感知發現時解除。',
                    '【移動與戰鬥】可在掩體間移動，結束回合時若位於掩體外則自動失效。戰鬥中敵人知道你最後消失的位置。'
                ],
                cure: '發起攻擊、發聲、敵方搜索成功發現，或離開掩體。'
            }
        ];

        let currentCategory = 'all';

        function setCategory(category) {
            currentCategory = category;

            ['all', 'dnd2024', 'mh'].forEach(cat => {
                const btn = document.getElementById(`tab-${cat}`);
                if (cat === category) {
                    btn.className = "px-2.5 py-1 rounded transition bg-amber-600 text-white font-bold";
                } else {
                    btn.className = "px-2.5 py-1 rounded transition text-stone-300 hover:text-white";
                }
            });

            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();

            const filtered = conditions.filter(item => {
                const matchesCategory = (currentCategory === 'all') || (item.category === currentCategory);
                
                const matchesSearch = item.name.toLowerCase().includes(searchTerm) ||
                                      item.type.toLowerCase().includes(searchTerm) ||
                                      item.cure.toLowerCase().includes(searchTerm) ||
                                      item.mechanics.some(m => m.toLowerCase().includes(searchTerm));

                return matchesCategory && matchesSearch;
            });

            document.getElementById('match-count').innerText = filtered.length;

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" class="px-6 py-12 text-center text-stone-400">
                            查無符合條件的狀態，請重新嘗試搜尋關鍵字。
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map((item, idx) => {
                const isDnd = item.category === 'dnd2024';
                const tagClass = isDnd 
                    ? 'bg-indigo-100 text-indigo-800 border-indigo-200' 
                    : 'bg-emerald-100 text-emerald-800 border-emerald-200';

                const rowBg = idx % 2 === 0 ? 'bg-white' : 'bg-stone-50/60';

                // Format markdown style bold text
                const formattedMechanics = item.mechanics.map(m => {
                    const formattedText = m.replace(/\*\*(.*?)\*\*/g, '<strong class="text-stone-900 font-bold bg-amber-50/80 px-1 rounded border border-amber-200/50">$1</strong>');
                    return `<li class="flex items-start gap-1.5"><span class="text-amber-600 font-bold leading-tight">•</span><span>${formattedText}</span></li>`;
                }).join('');

                return `
                    <tr class="${rowBg} hover:bg-amber-50/40 transition">
                        <!-- Column 1: Name & Type -->
                        <td class="px-4 py-4 align-top">
                            <div class="font-bold text-stone-900 text-base mb-1.5">${item.name}</div>
                            <div class="flex flex-wrap gap-1">
                                <span class="px-2 py-0.5 rounded text-xs font-semibold border ${tagClass}">${item.categoryLabel}</span>
                                <span class="px-2 py-0.5 rounded text-xs font-medium bg-stone-100 text-stone-600 border border-stone-200">${item.type}</span>
                            </div>
                        </td>

                        <!-- Column 2: Mechanics -->
                        <td class="px-5 py-4 align-top">
                            <ul class="space-y-1.5 text-stone-700 leading-relaxed">
                                ${formattedMechanics}
                            </ul>
                        </td>

                        <!-- Column 3: Cure -->
                        <td class="px-4 py-4 align-top text-stone-600 text-xs md:text-sm leading-relaxed bg-stone-50/30">
                            <div class="font-semibold text-stone-800 mb-1">✨ 解除 / 消除方式：</div>
                            ${item.cure}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Initialize Table
        window.onload = renderTable;
    </script>
</body>
</html>
